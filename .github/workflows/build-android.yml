name: Build Android App Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias del frontend
        run: npm install

      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Compilar frontend (Vite)
        run: npm run build

      - name: Inicializar Capacitor (si no existe)
        run: npx cap init "NeuroSync Pro" com.neurosync.pro --web-dir=dist || true

      - name: Agregar plataforma Android
        run: npx cap add android || true

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x ./android/gradlew

      - name: Forzar Gradle 8.9 (Requerido por Android Gradle Plugin)
        run: |
          echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-all.zip' > android/gradle/wrapper/gradle-wrapper.properties

      - name: Construir App Bundle (.aab)
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Subir archivo .aab como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: neurosync-pro-release
          path: android/app/build/outputs/bundle/release/app-release.aab
