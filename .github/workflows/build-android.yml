name: Build Android App Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias del frontend
        run: npm install

      - name: Instalar Capacitor (si no está en package.json)
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Compilar frontend (Vite)
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x ./android/gradlew

      - name: Configurar variables de entorno Android
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Aceptar licencias de Android
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Construir App Bundle (.aab)
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Subir archivo .aab como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: neurosync-pro-release
          path: android/app/build/outputs/bundle/release/app-release.aab
